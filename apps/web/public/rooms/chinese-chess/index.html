<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>中国象棋</title>
  <script type="module" crossorigin src="./assets/index-fDKUh83Y.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-SVYyTfWA.css">
</head>

<body>
  <div id="app">

    <!-- 侧边栏（始终可见） -->
    <div id="sidebar">
      <h2 id="sideTitle">中国象棋</h2>

      <!-- 玩家槽（红方 / 黑方） -->
      <div class="player-slot-row">
        <div class="player-slot empty" id="slotRed">
          <div class="slot-undo" id="undoRed" style="display:none">悔棋剩余：<span class="undo-num">2</span>/2</div>
          <div class="slot-name empty" id="playerRed">帥 红方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusRed"></div>
        </div>
        <div class="player-slot empty" id="slotBlack">
          <div class="slot-undo" id="undoBlack" style="display:none">悔棋剩余：<span class="undo-num">2</span>/2</div>
          <div class="slot-name empty" id="playerBlack">將 黑方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusBlack"></div>
        </div>
      </div>

      <!-- 统计 -->
      <div>
        <div class="stat-row"><span class="label">帥 红方</span><span class="val stat-red" id="statRed">0 胜 0 负 0
            平</span></div>
        <div class="stat-row"><span class="label">將 黑方</span><span class="val stat-black" id="statBlack">0 胜 0 负 0
            平</span></div>
      </div>

      <!-- 规则提示（按 mode 切换） -->
      <div id="ruleTip"></div>

      <!-- 残局步数条 -->
      <div id="puzzleStepBar" style="display:none">已走 <span id="puzzleStepCount">0</span> 步 / 限 <span
          id="puzzleStepLimit">0</span> 步</div>

      <!-- 底部按钮 -->
      <div id="bottomBtns">
        <button class="side-btn" id="btnUndo" style="display:none">悔棋</button>
        <button class="side-btn" id="btnRematch" style="display:none">再来一局</button>
        <button class="side-btn" id="btnReplay" style="display:none">重开</button>
        <button class="side-btn" id="btnResign" disabled>认输</button>
        <button class="side-btn" id="btnBack" style="display:none">返回选择</button>
      </div>
    </div>

    <!-- 棋盘 -->
    <div id="boardWrap">
      <div id="turnIndicator">红方走子</div>
      <div id="winBanner"><span id="winText"></span><small id="winSub"></small></div>

      <!-- 提示弹窗（认输/和棋请求等用） -->
      <div id="requestBanner">
        <div id="requestText">对方提和</div>
        <div id="requestTimer" style="display:none"><span id="requestTimerNum">15</span>s</div>
        <div class="req-btns">
          <button id="reqAccept" class="req-btn accept">同意</button>
          <button id="reqReject" class="req-btn reject">拒绝</button>
        </div>
        <div class="req-ack" style="display:none">
          <button id="reqAck" class="req-btn accept">知道了</button>
        </div>
      </div>

      <!-- 顶部轻量提示 -->
      <div id="toast"></div>

      <canvas id="board"></canvas>
    </div>

    <!-- 模式选择面板（全屏覆盖） -->
    <div id="modePanel">
      <h1>中国象棋</h1>
      <div class="sub">经典 · 揭棋 · 残局</div>

      <div class="section-label">选择模式</div>
      <div class="opt-group" id="gameGroup">
        <button class="opt-btn active" data-game="classic">经典象棋</button>
        <button class="opt-btn" data-game="banzhu">揭棋</button>
        <button class="opt-btn" data-game="puzzle">残局挑战</button>
      </div>

      <div class="section-label" id="modeSectionLabel">对战模式</div>
      <div class="opt-group" id="modeGroup">
        <button class="opt-btn" data-mode="ai">人机对战</button>
        <button class="opt-btn active" data-mode="online">在线联机</button>
      </div>

      <!-- AI 难度（人机模式下显示） -->
      <div class="opt-group" id="aiLevelGroup">
        <button class="opt-btn" data-level="0">入门</button>
        <button class="opt-btn active" data-level="1">普通</button>
        <button class="opt-btn" data-level="2">困难</button>
        <button class="opt-btn" data-level="3">大师</button>
      </div>

      <!-- 执方选择（人机/在线都用） -->
      <div class="opt-group" id="sideGroup">
        <button class="opt-btn active" data-side="r">执红</button>
        <button class="opt-btn" data-side="b">执黑</button>
      </div>

      <!-- 残局面选择（仅残局模式下显示） -->
      <div id="puzzleGroup">
        <div class="section-label" style="margin:0">选择残局面</div>
        <div id="puzzleList"></div>
      </div>

      <!-- 在线联机玩家区 -->
      <div id="onlineLobby" class="hide">
        <div class="player-slot-row">
          <div class="player-slot empty" id="onlineSlotRed">
            <div class="slot-name empty" id="onlineNameRed">帥 红方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagRed"></div>
          </div>
          <div class="player-slot empty" id="onlineSlotBlack">
            <div class="slot-name empty" id="onlineNameBlack">將 黑方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagBlack"></div>
          </div>
        </div>
        <button id="onlineReadyBtn">准备</button>
      </div>

      <button id="startBtn">开始对局</button>
    </div>
  </div>

</body>

</html>
