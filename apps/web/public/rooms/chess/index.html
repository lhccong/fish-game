<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>五子棋与围棋</title>
  <script type="module" crossorigin src="./assets/index-Cb3wfSoQ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Coo30ItW.css">
</head>

<body>
  <div id="app">

    <!-- 侧边栏（始终可见） -->
    <div id="sidebar">
      <h2 id="sideTitle">五子棋与围棋</h2>

      <!-- 玩家槽（从一开始就同步显示角色） -->
      <div class="player-slot-row">
        <div class="player-slot empty" id="slotBlack">
          <div class="slot-name empty" id="playerBlack">● 黑方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusBlack"></div>
        </div>
        <div class="player-slot empty" id="slotWhite">
          <div class="slot-name empty" id="playerWhite">○ 白方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusWhite"></div>
        </div>
      </div>

      <!-- 统计 -->
      <div>
        <div class="stat-row"><span class="label">● 黑方</span><span class="val stat-black" id="statBlack">0 胜 0 负 0
            平</span></div>
        <div class="stat-row"><span class="label">○ 白方</span><span class="val stat-white" id="statWhite">0 胜 0 负 0
            平</span></div>
      </div>

      <!-- 规则提示 -->
      <div id="ruleTip"></div>

      <!-- 悔棋次数提示 -->
      <div id="undoTip" style="display:none">悔棋剩余：<span id="undoCount">2</span>/2</div>

      <!-- 底部按钮：根据对局阶段动态切换 -->
      <div id="bottomBtns">
        <button class="side-btn" id="btnUndo" disabled>悔棋</button>
        <button class="side-btn" id="btnContinue" style="display:none">继续对局</button>
        <button class="side-btn" id="btnConfirmDead" style="display:none">确认死棋</button>
        <button class="side-btn" id="btnRematch" style="display:none">重开</button>
        <button class="side-btn" id="btnResign" disabled>投降</button>
        <button class="side-btn" id="btnBack" style="display:none">返回选择</button>
      </div>
    </div>

    <!-- 棋盘 -->
    <div id="boardWrap">
      <div id="turnIndicator">黑方落子</div>
      <div id="winBanner"><span id="winText"></span><small id="winSub"></small></div>

      <!-- 对方请求确认弹窗 -->
      <div id="requestBanner">
        <div id="requestText">对方请求悔棋</div>
        <div id="requestTimer" style="display:none"><span id="requestTimerNum">15</span>s</div>
        <div class="req-btns">
          <button id="reqAccept" class="req-btn accept">同意</button>
          <button id="reqReject" class="req-btn reject">拒绝</button>
        </div>
        <div class="req-ack" style="display:none">
          <button id="reqAck" class="req-btn accept">知道了</button>
        </div>
      </div>

      <!-- 顶部轻量提示 -->
      <div id="toast"></div>

      <canvas id="board"></canvas>
    </div>

    <!-- 模式选择面板（全屏覆盖，顶部显示） -->
    <div id="modePanel">
      <h1>弈 合</h1>
      <div class="sub">五子棋 · 围棋 · 二合一</div>

      <div class="section-label">选择棋种</div>
      <div class="opt-group" id="gameGroup">
        <button class="opt-btn active" data-game="gomoku">五子棋</button>
        <button class="opt-btn" data-game="go">围棋</button>
      </div>

      <div class="section-label">对战模式</div>
      <div class="opt-group" id="modeGroup">
        <button class="opt-btn" data-mode="ai">人机对战</button>
        <button class="opt-btn active" data-mode="online">在线联机</button>
      </div>

      <!-- AI 难度 -->
      <div class="opt-group" id="aiLevelGroup">
        <button class="opt-btn" data-level="0">入门</button>
        <button class="opt-btn active" data-level="1">普通</button>
        <button class="opt-btn" data-level="2">困难</button>
        <button class="opt-btn" data-level="3">大师</button>
      </div>

      <!-- 执子方选择（AI 模式和在线模式都用；先手固定黑先，与执子方无关） -->
      <div class="opt-group" id="sideGroup">
        <button class="opt-btn" data-side="black">执黑</button>
        <button class="opt-btn" data-side="white">执白</button>
      </div>

      <!-- 在线联机玩家区（与侧边栏卡片样式一致） -->
      <div id="onlineLobby">
        <div class="player-slot-row">
          <div class="player-slot empty" id="onlineSlotBlack">
            <div class="slot-name empty" id="onlineNameBlack">● 黑方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagBlack"></div>
          </div>
          <div class="player-slot empty" id="onlineSlotWhite">
            <div class="slot-name empty" id="onlineNameWhite">○ 白方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagWhite"></div>
          </div>
        </div>
        <button id="onlineReadyBtn">准备</button>
      </div>

      <button id="startBtn">开始对局</button>
    </div>
  </div>

</body>

</html>
