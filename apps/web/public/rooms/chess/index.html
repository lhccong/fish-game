<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>弈合 · 五子棋与围棋</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0ece4;
      color: #3d3429
    }

    #app {
      display: flex;
      height: 100%;
      position: relative
    }

    /* ===== 侧边栏 ===== */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: #f7f4ee;
      border-right: 1px solid #e0d8c8;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 12px;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 14px;
      letter-spacing: 3px;
      color: #5a4f3e;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2px
    }

    /* 玩家槽 */
    .player-slot-row {
      display: flex;
      gap: 8px;
      align-items: stretch
    }

    .player-slot {
      flex: 1;
      padding: 12px 10px;
      border-radius: 10px;
      border: 2px solid #ddd4c4;
      background: #fff;
      text-align: center;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: relative;
    }

    .player-slot.empty {
      border-style: dashed;
      background: #f7f4ee
    }

    .player-slot.ready {
      border-color: #5a8a4a;
      background: #eef5e8
    }

    /* AI 槽：与玩家槽边框一致，但用淡色底+斜体名区分 */
    .player-slot.ai {
      border-color: #c9bfa9;
      background: #faf7f0
    }

    .player-slot.ai .name-text {
      font-style: italic;
      color: #9b8e7b
    }

    /* 自己所在的槽高亮 */
    .player-slot.me {
      border-color: #5a4f3e;
      background: #fffef8;
      box-shadow: 0 0 0 3px rgba(90, 79, 62, .2), 0 2px 8px rgba(90, 79, 62, .15);
    }

    .player-slot.me::before {
      content: '你';
      position: absolute;
      top: -8px;
      right: -4px;
      background: #5a4f3e;
      color: #f0ece4;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 1px 5px;
      border-radius: 8px;
    }

    .slot-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #9b8e7b;
      line-height: 1.3;
    }

    .slot-name {
      font-size: 14px;
      font-weight: 600;
      color: #3d3429;
      min-height: 20px;
      word-break: break-all;
      line-height: 1.4;
    }

    .slot-name.empty {
      color: #bbb;
      font-weight: 400;
      font-size: 12px;
    }

    .slot-name .name-text {
      font-weight: 600;
      color: #3d3429;
    }

    .slot-name.empty .name-text {
      color: #bbb;
      font-weight: 400;
    }

    .slot-status {
      font-size: 11px;
      letter-spacing: 1px;
      min-height: 14px;
      line-height: 1.3;
    }

    .slot-status.ok {
      color: #3a7a3a;
      font-weight: 700
    }

    .slot-status.waiting {
      color: #bbb
    }

    .slot-status.ai {
      color: #888
    }

    /* 统计 */
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #ece5d8
    }

    .stat-row .label {
      color: #9b8e7b
    }

    .stat-row .val {
      font-weight: 600;
      color: #5a4f3e
    }

    .stat-black {
      color: #1a1a1a !important
    }

    .stat-white {
      color: #888 !important
    }

    /* 底部按钮 */
    #bottomBtns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #ece5d8;
      padding-top: 10px;
      margin-top: auto
    }

    .side-btn {
      padding: 9px 0;
      border-radius: 8px;
      border: 1px solid #ddd4c4;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 2px;
      color: #5a4f3e;
      transition: all .15s
    }

    .side-btn:active {
      background: #ece5d8
    }

    .side-btn:disabled {
      opacity: .35;
      cursor: default
    }

    /* 规则提示 */
    #ruleTip {
      font-size: 11px;
      color: #a09480;
      line-height: 1.7;
      padding: 8px 10px;
      background: #efe9dd;
      border-radius: 8px
    }

    /* 悔棋次数提示 */
    #undoTip {
      font-size: 12px;
      color: #7a6a52;
      padding: 6px 10px;
      background: #f7f1e3;
      border-radius: 8px;
      text-align: center;
    }
    #undoTip.exhausted {
      color: #b04848;
    }

    /* ===== 棋盘区域 ===== */
    #boardWrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      overflow: hidden
    }

    canvas {
      display: block;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(60, 40, 10, .15);
      transition: width .3s, height .3s;
      touch-action: manipulation
    }

    #turnIndicator {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 3px;
      color: #7a6e5c;
      background: rgba(247, 244, 238, .9);
      padding: 6px 20px;
      border-radius: 20px;
      pointer-events: none;
      transition: opacity .3s
    }

    #turnIndicator.hide {
      opacity: 0
    }

    #winBanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      letter-spacing: 6px;
      color: #5a4f3e;
      background: rgba(247, 244, 238, .95);
      padding: 24px 48px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(60, 40, 10, .2);
      display: none;
      text-align: center;
      z-index: 10
    }

    #winBanner.show {
      display: block
    }

    #winBanner small {
      display: block;
      font-size: 12px;
      color: #a09480;
      margin-top: 10px;
      letter-spacing: 2px
    }

    #requestBanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(247, 244, 238, .96);
      padding: 24px 32px;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .15);
      display: none;
      z-index: 30;
      text-align: center;
      min-width: 240px;
    }

    #requestBanner.show {
      display: block
    }

    #requestTimer {
      font-size: 13px;
      color: #b04848;
      margin-top: 6px;
      font-weight: 600;
    }

    /* 顶部轻量提示（开始游戏失败等即时反馈） */
    #toast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(58, 48, 36, .92);
      color: #f0ece4;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }
    #toast.show {
      opacity: 1
    }

    #requestText {
      font-size: 16px;
      color: #3d3429;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .req-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .req-btn {
      padding: 8px 24px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .req-btn.accept {
      background: #6b8e4e;
      color: #fff;
    }

    .req-btn.reject {
      background: #c0392b;
      color: #fff;
    }

    /* ===== 中央模式选择面板 ===== */
    #modePanel {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(247, 244, 238, .97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity .35s;
    }

    #modePanel.hide {
      opacity: 0;
      pointer-events: none
    }

    #modePanel h1 {
      font-size: 26px;
      letter-spacing: 6px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #4a3f30
    }

    #modePanel .sub {
      font-size: 12px;
      color: #9b8e7b;
      margin-bottom: 24px;
      letter-spacing: 2px
    }

    .section-label {
      font-size: 11px;
      color: #a09480;
      margin-bottom: 6px;
      letter-spacing: 3px
    }

    .opt-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center
    }

    .opt-btn {
      padding: 10px 24px;
      border-radius: 10px;
      border: 1.5px solid #c8bca8;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s;
      color: #5a4f3e;
      letter-spacing: 1px;
    }

    .opt-btn.active {
      border-color: #5a4f3e;
      background: #5a4f3e;
      color: #f0ece4
    }

    .opt-btn:active {
      transform: scale(.96)
    }

    /* AI 难度 */
    #aiLevelGroup {
      display: none;
      margin-bottom: 14px
    }

    #aiLevelGroup.show {
      display: flex
    }

    #sideGroup {
      display: none;
      margin-bottom: 14px
    }

    #sideGroup.show {
      display: flex
    }

    /* 在线联机玩家区（面板内，与侧边栏共用 .player-slot 样式） */
    #onlineLobby {
      margin-bottom: 18px
    }

    #onlineLobby .player-slot-row {
      margin-bottom: 14px
    }

    #onlineLobby.hide {
      display: none
    }

    /* 在线 lobby 内的空位：可点击选择执子方 */
    #onlineLobby .player-slot.empty {
      cursor: pointer;
    }
    #onlineLobby .player-slot.empty:hover {
      border-color: #5a4f3e;
      background: #efe9dd;
    }
    /* 在线 lobby 内的"我已选"位：可点击离开 */
    #onlineLobby .player-slot.me {
      cursor: pointer;
    }
    #onlineLobby .player-slot.me:hover::after {
      content: '点击换边';
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 10px;
      color: #8a7e69;
    }

    #onlineReadyBtn {
      width: 100%;
      padding: 11px 0;
      border-radius: 10px;
      border: none;
      background: #5a4f3e;
      color: #f0ece4;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all .2s;
    }

    #onlineReadyBtn:active {
      transform: scale(.98)
    }

    #onlineReadyBtn:disabled {
      opacity: .4;
      cursor: default
    }

    #onlineReadyBtn.cancel {
      background: #a09480
    }

    #startBtn {
      width: auto;
      min-width: 200px;
      margin: 8px auto 0;
      display: block;
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      background: #5a4f3e;
      color: #f0ece4;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .2s;
    }

    #startBtn.green {
      background: #3a7a3a;
    }

    #startBtn:active {
      transform: scale(.96)
    }

    #startBtn:disabled {
      opacity: .4;
      cursor: default
    }

    /* 移动端 */
    @media (max-width: 700px) {
      #app {
        flex-direction: column
      }

      #sidebar {
        width: 100%;
        min-width: 0;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 10px 12px;
        gap: 8px;
        border-right: none;
        border-bottom: 1px solid #e0d8c8;
        max-height: 160px;
        overflow-y: auto
      }

      #sidebar h2 {
        width: 100%;
        font-size: 13px;
        text-align: left
      }

      .player-slot-row {
        width: 100%
      }

      #bottomBtns {
        flex-direction: row;
        width: 100%;
        border-top: none;
        padding-top: 0;
        margin-top: 0
      }

      .side-btn {
        flex: 1;
        padding: 8px 0;
        font-size: 12px
      }

      #boardWrap {
        padding: 8px
      }

      .stat-row {
        font-size: 11px
      }

      #modePanel {
        padding: 16px
      }

      #modePanel h1 {
        font-size: 22px
      }

      .opt-btn {
        padding: 9px 18px;
        font-size: 13px
      }

      #startBtn {
        padding: 10px 22px;
        font-size: 15px
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- 侧边栏（始终可见） -->
    <div id="sidebar">
      <h2 id="sideTitle">弈合</h2>

      <!-- 玩家槽（从一开始就同步显示角色） -->
      <div class="player-slot-row">
        <div class="player-slot empty" id="slotBlack">
          <div class="slot-name empty" id="playerBlack">● 黑方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusBlack"></div>
        </div>
        <div class="player-slot empty" id="slotWhite">
          <div class="slot-name empty" id="playerWhite">○ 白方 <span class="name-text">等待加入…</span></div>
          <div class="slot-status waiting" id="statusWhite"></div>
        </div>
      </div>

      <!-- 统计 -->
      <div>
        <div class="stat-row"><span class="label">● 黑方</span><span class="val stat-black" id="statBlack">0 胜 0 负 0
            平</span></div>
        <div class="stat-row"><span class="label">○ 白方</span><span class="val stat-white" id="statWhite">0 胜 0 负 0
            平</span></div>
      </div>

      <!-- 规则提示 -->
      <div id="ruleTip"></div>

      <!-- 悔棋次数提示 -->
      <div id="undoTip" style="display:none">悔棋剩余：<span id="undoCount">2</span>/2</div>

      <!-- 底部按钮：根据对局阶段动态切换 -->
      <div id="bottomBtns">
        <button class="side-btn" id="btnUndo" disabled>悔棋</button>
        <button class="side-btn" id="btnContinue" style="display:none">继续对局</button>
        <button class="side-btn" id="btnConfirmDead" style="display:none">确认死棋</button>
        <button class="side-btn" id="btnRematch" style="display:none">重开</button>
        <button class="side-btn" id="btnResign" disabled>投降</button>
        <button class="side-btn" id="btnBack" style="display:none">返回选择</button>
      </div>
    </div>

    <!-- 棋盘 -->
    <div id="boardWrap">
      <div id="turnIndicator">黑方落子</div>
      <div id="winBanner"><span id="winText"></span><small id="winSub"></small></div>

      <!-- 对方请求确认弹窗 -->
      <div id="requestBanner">
        <div id="requestText">对方请求悔棋</div>
        <div id="requestTimer" style="display:none"><span id="requestTimerNum">15</span>s</div>
        <div class="req-btns">
          <button id="reqAccept" class="req-btn accept">同意</button>
          <button id="reqReject" class="req-btn reject">拒绝</button>
        </div>
        <div class="req-ack" style="display:none">
          <button id="reqAck" class="req-btn accept">知道了</button>
        </div>
      </div>

      <!-- 顶部轻量提示 -->
      <div id="toast"></div>

      <canvas id="board"></canvas>
    </div>

    <!-- 模式选择面板（全屏覆盖，顶部显示） -->
    <div id="modePanel">
      <h1>弈 合</h1>
      <div class="sub">五子棋 · 围棋 · 二合一</div>

      <div class="section-label">选择棋种</div>
      <div class="opt-group" id="gameGroup">
        <button class="opt-btn active" data-game="gomoku">五子棋</button>
        <button class="opt-btn" data-game="go">围棋</button>
      </div>

      <div class="section-label">对战模式</div>
      <div class="opt-group" id="modeGroup">
        <button class="opt-btn" data-mode="ai">人机对战</button>
        <button class="opt-btn active" data-mode="online">在线联机</button>
      </div>

      <!-- AI 难度 -->
      <div class="opt-group" id="aiLevelGroup">
        <button class="opt-btn" data-level="0">入门</button>
        <button class="opt-btn active" data-level="1">普通</button>
        <button class="opt-btn" data-level="2">困难</button>
        <button class="opt-btn" data-level="3">大师</button>
      </div>

      <!-- 执子方选择（AI 模式和在线模式都用；先手固定黑先，与执子方无关） -->
      <div class="opt-group" id="sideGroup">
        <button class="opt-btn" data-side="black">执黑</button>
        <button class="opt-btn" data-side="white">执白</button>
      </div>

      <!-- 在线联机玩家区（与侧边栏卡片样式一致） -->
      <div id="onlineLobby">
        <div class="player-slot-row">
          <div class="player-slot empty" id="onlineSlotBlack">
            <div class="slot-name empty" id="onlineNameBlack">● 黑方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagBlack"></div>
          </div>
          <div class="player-slot empty" id="onlineSlotWhite">
            <div class="slot-name empty" id="onlineNameWhite">○ 白方 <span class="name-text">等待加入…</span></div>
            <div class="slot-status waiting" id="onlineFlagWhite"></div>
          </div>
        </div>
        <button id="onlineReadyBtn">准备</button>
      </div>

      <button id="startBtn">开始对局</button>
    </div>
    </div>

  </div>

  <script>
    (function () {
      "use strict";

      var SIZE_GOMOKU = 15, SIZE_GO = 19;
      var EMPTY = 0, BLACK = 1, WHITE = 2;

      var gameType = 'gomoku';
      var mode = 'online';
      var aiLevel = 1;
      var myRole = 0;        // 1=Black, 2=White, 0=未知
      var myReady = false;
      var isHost = false;     // 是否是房主
      var onlineJoined = false;
      var hostId = null;      // 房主 playerId（来自 worker state）
      var hostSide = 'black'; // AI 模式：房主选择的执子方 'black'|'white'
      var myAiSide = 'black'; // AI 模式：本地房主执子方（'black' 或 'white'），与 hostSide 同义但便于本地访问

      var state = {
        boardSize: 15,
        board: null,
        turn: BLACK,
        finished: false,
        winner: 0,
        moves: [],
        undoCount: { black: 2, white: 2 },
        capturedB: 0, capturedW: 0,
        passes: 0,
        lastMove: null,
        winLine: null,
        phase: 'idle',       // 'idle' | 'lobby' | 'playing' | 'end_confirm' | 'finished'
        confirmDeadBy: { black: false, white: false },
        // 在线联机状态（onState 同步）
        players: {},
        blackPlayer: null,
        whitePlayer: null,
        blackReady: false,
        whiteReady: false,
        stats: {
          blackWins: 0, blackLosses: 0, blackDraws: 0,
          whiteWins: 0, whiteLosses: 0, whiteDraws: 0
        }
      };

      var canvas, ctx, cellSize, padding, cssSize;
      var subscription = null;
      var shownRequestResults = {}; // ts -> true，已显示过的请求结果去重用
      var noRespShownKey = null; // 纯通知（noResponse）弹窗 1 秒自动关去重用
      var noRespHideTimer = null; // 纯通知 1 秒关弹窗计时句柄
      var countdownKey = null; // 倒计时启动的去重 key（用 pendingRequest.createdAt）
      // 每次实时检查 parti 是否已注入（脚本加载时 parti 尚未注入，所以不能写 var）
      function hasParti() { return !!(parti && typeof parti.onState === 'function'); }

      function partiAction(name, payload) {
        if (hasParti()) return parti.action(name, payload);
        return Promise.resolve({ ok: true });
      }
      function partiLog() {
        if (hasParti() && parti.log) parti.log.apply(parti, arguments);
      }

      /* ==================================================================
         元素引用
      ================================================================== */
      var $ = function (id) { return document.getElementById(id); };
      var modePanel = $('modePanel');
      var boardWrap = $('boardWrap');
      var turnIndicator = $('turnIndicator');
      var winBanner = $('winBanner');
      var winText = $('winText');
      var winSub = $('winSub');
      var requestBanner = $('requestBanner');
      var requestText = $('requestText');
      var requestTimer = $('requestTimer');
      var requestTimerNum = $('requestTimerNum');
      var reqAcceptBtn = $('reqAccept');
      var reqRejectBtn = $('reqReject');

      // 请求超时倒计时（worker 端 15 秒后自动拒绝）
      var REQUEST_TIMEOUT_SEC = 15;
      var countdownInterval = null;
      function startCountdown(secs) {
        stopCountdown();
        requestTimerNum.textContent = secs;
        requestTimer.style.display = '';
        countdownInterval = setInterval(function () {
          secs--;
          if (secs <= 0) {
            stopCountdown();
            return;
          }
          requestTimerNum.textContent = secs;
        }, 1000);
      }
      function stopCountdown() {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        requestTimer.style.display = 'none';
      }

        // 房主判定：以 hostId 为准（与执子方解耦）
        var localIsHost = !!(hostId && parti.playerId && hostId === parti.playerId);

        // 面板上的两个角色卡：直接复用侧边栏的 fillSlot，结构/样式完全一致
        var blackIsMe = parti.playerId && parti.playerId === s.blackPlayer;
        var whiteIsMe = parti.playerId && parti.playerId === s.whitePlayer;
        fillSlot(onlineSlotBlack, onlineNameBlack, onlineFlagBlack, s.blackPlayer, blackIsMe, 'black');
        fillSlot(onlineSlotWhite, onlineNameWhite, onlineFlagWhite, s.whitePlayer, whiteIsMe, 'white');

        var bothJoined = !!s.blackPlayer && !!s.whitePlayer;
        var bothReady = s.blackReady && s.whiteReady;

        // 准备按钮：只要自己已分配角色（房主或玩家）就可以点准备
        var myReadyKey = myRole === BLACK ? 'blackReady' : (myRole === WHITE ? 'whiteReady' : null);
        var iAmReady = myReadyKey && state[myReadyKey];
        onlineReadyBtn.classList.remove('cancel');
        onlineReadyBtn.textContent = iAmReady ? '取消准备' : '准备';
        if (iAmReady) onlineReadyBtn.classList.add('cancel');
        onlineReadyBtn.disabled = !myReadyKey;

        // 开始按钮：在线非房主隐藏，人机模式/房主显示
        if (mode === 'online' && !localIsHost) {
          startBtn.style.display = 'none';
        } else {
          startBtn.style.display = '';
          if (mode === 'online' && localIsHost && bothReady) {
            startBtn.classList.add('green');
            startBtn.disabled = false;
          } else {
            startBtn.classList.remove('green');
            startBtn.disabled = false;
          }
        }

        // 非房主：禁用棋种选择、对战模式、AI 难度（只能看不能改）
        var gameTypeBtns = document.querySelectorAll('#gameGroup .opt-btn');
        var aiLevelBtns = document.querySelectorAll('#aiLevelGroup .opt-btn');
        var modeBtns = document.querySelectorAll('#modeGroup .opt-btn');
        if (!localIsHost && s.blackPlayer) {
          gameTypeBtns.forEach(function(btn) { btn.disabled = true; });
          aiLevelBtns.forEach(function(btn) { btn.disabled = true; });
          modeBtns.forEach(function(btn) { btn.disabled = true; });
        } else {
          gameTypeBtns.forEach(function(btn) { btn.disabled = false; });
          aiLevelBtns.forEach(function(btn) { btn.disabled = false; });
          modeBtns.forEach(function(btn) { btn.disabled = false; });
        }
        // sideGroup 高亮同步（AI 模式/在线模式都更新）
        updateSideActive();
      }

      /* ==================================================================
         侧边栏玩家槽同步更新
      ================================================================== */
      function updateSidebarSlots(s) {
        if (!s) return;

        // 同步本地 state（fillSlot 依赖 state 字段）
        state.players = s.players || state.players;
        state.blackReady = !!s.blackReady;
        state.whiteReady = !!s.whiteReady;

        var blackIsMe = parti.playerId && parti.playerId === s.blackPlayer;
        var whiteIsMe = parti.playerId && parti.playerId === s.whitePlayer;
        myRole = blackIsMe ? BLACK : (whiteIsMe ? WHITE : 0);

        if (s.mode === 'ai') {
          // AI 模式：房主执某方（由 hostSide 决定，AI 执另一边）
          // 兼容旧状态（无 hostSide / 无 hostId）：用 blackPlayer 判定
          var hostIsBlack;
          if (s.hostSide === 'black' || s.hostSide === 'white') {
            hostIsBlack = s.hostSide === 'black';
          } else if (s.hostId) {
            hostIsBlack = s.hostId === s.blackPlayer;
          } else {
            hostIsBlack = blackIsMe;
          }
          myAiSide = hostIsBlack ? 'black' : 'white'; // 本地缓存执子方
          if (hostIsBlack) {
            // 房主执黑：黑槽=房主，白槽=AI
            fillSlot(slotBlack, playerBlackEl, statusBlackEl, s.hostId || s.blackPlayer, true, 'black');
            // 白方显示 AI
            playerWhiteEl.innerHTML = '○ 白方 <span class="name-text">AI</span>';
            slotWhite.className = 'player-slot ai';
            slotWhite.classList.remove('empty', 'me', 'ready');
            statusWhiteEl.textContent = '执白';
            statusWhiteEl.className = 'slot-status ai';
          } else {
            // 房主执白：黑槽=AI，白槽=房主
            playerBlackEl.innerHTML = '● 黑方 <span class="name-text">AI</span>';
            slotBlack.className = 'player-slot ai';
            slotBlack.classList.remove('empty', 'me', 'ready');
            statusBlackEl.textContent = '执黑';
            statusBlackEl.className = 'slot-status ai';
            fillSlot(slotWhite, playerWhiteEl, statusWhiteEl, s.hostId || s.whitePlayer, true, 'white');
          }
        } else {
          fillSlot(slotBlack, playerBlackEl, statusBlackEl, s.blackPlayer, blackIsMe, 'black');
          fillSlot(slotWhite, playerWhiteEl, statusWhiteEl, s.whitePlayer, whiteIsMe, 'white');
        }
      }

      /* ==================================================================
         人机模式
      ================================================================== */
      function startAI() {
        // 房主执方决定谁是黑/白，AI 执另一边
        // 五子棋/围棋均为黑先白后：与执子方无关
        var hostIsBlack = myAiSide === 'black';
        myRole = hostIsBlack ? BLACK : WHITE;
        isHost = true; // AI 模式：点击"开始"的人就是房主
        onlineJoined = false;
        state.boardSize = gameType === 'go' ? SIZE_GO : SIZE_GOMOKU;
        state.board = createBoard(state.boardSize);
        // 五子棋/围棋均为黑先白后；若玩家执白则 AI(黑) 先走
        state.turn = (myAiSide === 'white') ? 2 /*WHITE*/ : 1 /*BLACK*/;
        state.finished = false;
        state.winner = 0;
        state.moves = [];
        state.undoCount = { black: 2, white: 2 };
        state.capturedB = 0; state.capturedW = 0;
        state.passes = 0;
        state.lastMove = null;
        state.winLine = null;
        state.phase = 'playing';
        state.winReason = '';

        // 侧边栏
        if (hostIsBlack) {
          playerBlackEl.innerHTML = '● 黑方 <span class="name-text">你</span>';
          playerBlackEl.className = 'slot-name';
          slotBlack.classList.remove('empty');
          slotBlack.classList.add('me');
          statusBlackEl.textContent = '执黑';
          statusBlackEl.className = 'slot-status ok';
          slotBlack.classList.remove('ready');

          playerWhiteEl.innerHTML = '○ 白方 <span class="name-text">AI</span>';
          playerWhiteEl.className = 'slot-name';
          slotWhite.classList.remove('empty');
          slotWhite.classList.remove('me', 'ready');
          statusWhiteEl.textContent = '执白';
          statusWhiteEl.className = 'slot-status ai';
        } else {
          // 房主执白：房主显示在白方槽，AI 执黑
          playerBlackEl.innerHTML = '● 黑方 <span class="name-text">AI</span>';
          playerBlackEl.className = 'slot-name';
          slotBlack.classList.remove('empty');
          slotBlack.classList.remove('me', 'ready');
          statusBlackEl.textContent = '执黑';
          statusBlackEl.className = 'slot-status ai';

          playerWhiteEl.innerHTML = '○ 白方 <span class="name-text">你</span>';
          playerWhiteEl.className = 'slot-name';
          slotWhite.classList.remove('empty');
          slotWhite.classList.add('me');
          statusWhiteEl.textContent = '执白';
          statusWhiteEl.className = 'slot-status ok';
          slotWhite.classList.remove('ready');
        }

        // 面板隐藏
        modePanel.classList.add('hide');

        computeLayout();
        render();

        // AI 先手时立即触发第一步
        var aiColor2 = myAiSide === 'black' ? WHITE : BLACK;
        if (state.turn === aiColor2) {
          setTimeout(function () {
            if (!state.finished) {
              var mv = gameType === 'gomoku'
                ? aiGomokuMove(state.board, aiColor2)
                : aiGoMove(state.board, aiColor2);
              if (mv) localPlace(mv.r, mv.c);
            }
          }, 400 + Math.random() * 200);
        }
      }

      // 本地重开（无 parti 时使用）：仅重置棋盘/对局状态，保留 mode / gameType / aiLevel
      function localRematch() {
        state.boardSize = gameType === 'go' ? SIZE_GO : SIZE_GOMOKU;
        state.board = createBoard(state.boardSize);
        // 执白时 AI(黑) 先走
        state.turn = (myAiSide === 'white') ? WHITE : BLACK;
        state.finished = false;
        state.winner = 0;
        state.moves = [];
        state.undoCount = { black: 2, white: 2 };
        state.capturedB = 0; state.capturedW = 0;
        state.passes = 0;
        state.lastMove = null;
        state.winLine = null;
        state.phase = 'playing';
        state.winReason = '';
        myReady = false;
        isHost = true; // AI 模式房主即玩家
        if (winBanner) winBanner.classList.remove('show');
        render();
        // AI 先手时立即触发
        var aiColorR = myAiSide === 'black' ? WHITE : BLACK;
        if (state.turn === aiColorR) {
          setTimeout(function () {
            if (!state.finished) {
              var mv = gameType === 'gomoku'
                ? aiGomokuMove(state.board, aiColorR)
                : aiGoMove(state.board, aiColorR);
              if (mv) localPlace(mv.r, mv.c);
            }
          }, 400 + Math.random() * 200);
        }
      }

      /* ==================================================================
         在线模式：加入并监听状态
      ================================================================== */
      function joinOnline() {
        if (subscription) { subscription(); subscription = null; }

        onlineJoined = true;
        myRole = 0;
        myReady = false;

        state.phase = 'lobby';
        state.boardSize = gameType === 'gomoku' ? SIZE_GOMOKU : SIZE_GO;
        state.board = createBoard(state.boardSize);

        // 重置侧边栏槽
        playerBlackEl.innerHTML = '● 黑方 <span class="name-text">等待加入…</span>';
        playerBlackEl.className = 'slot-name empty';
        slotBlack.classList.add('empty');
        slotBlack.classList.remove('me', 'ready');
        statusBlackEl.textContent = '';
        statusBlackEl.className = 'slot-status waiting';

        playerWhiteEl.innerHTML = '○ 白方 <span class="name-text">等待加入…</span>';
        playerWhiteEl.className = 'slot-name empty';
        slotWhite.classList.add('empty');
        slotWhite.classList.remove('me', 'ready');
        statusWhiteEl.textContent = '';
        statusWhiteEl.className = 'slot-status waiting';

        if (hasParti) {
          initOnlineSession();
        } else {
          // 本地预览模拟
          myRole = BLACK;
          playerBlackEl.innerHTML = '● 黑方 <span class="name-text">你</span>';
          playerBlackEl.className = 'slot-name';
          slotBlack.classList.remove('empty');
          slotBlack.classList.add('me');
          statusBlackEl.textContent = '等待对手';
          statusBlackEl.className = 'slot-status waiting';
          render();
        }
      }

      function initOnlineSession() {
        if (subscription) { subscription(); subscription = null; }
        if (!hasParti) return;
        if (parti.ready) parti.ready();

        var tempState = {
          players: {},
          blackPlayer: null,
          whitePlayer: null,
          blackReady: false,
          whiteReady: false
        };
        updateSidebarSlots(tempState);

        subscription = parti.onState(function (s) {
          if (!s) return;
          state.stats = s.stats || state.stats;
          state.players = s.players || state.players;
          state.blackReady = !!s.blackReady;
          state.whiteReady = !!s.whiteReady;
          // 同步玩家槽位（用于按钮/UI 判断双方是否就位）
          if ('blackPlayer' in s) state.blackPlayer = s.blackPlayer;
          if ('whitePlayer' in s) state.whitePlayer = s.whitePlayer;
          if ('hostId' in s) hostId = s.hostId;
          var blackIsMe = parti.playerId && parti.playerId === s.blackPlayer;
          var whiteIsMe = parti.playerId && parti.playerId === s.whitePlayer;
          myRole = blackIsMe ? BLACK : (whiteIsMe ? WHITE : 0);
          isHost = !!(hostId && parti.playerId === hostId);
          // 返回选择按钮：仅在 updateUI 中根据 phase/isHost 控制
          if (s.mode !== undefined && s.mode !== mode) {
            mode = s.mode;
            modeGroup.querySelectorAll('.opt-btn').forEach(function (b) {
              b.classList.toggle('active', b.dataset.mode === mode);
            });
            aiLevelGroup.classList.toggle('show', mode === 'ai');
            onlineLobby.classList.toggle('hide', mode === 'ai');
            sideGroup.classList.toggle('show', mode === 'ai');
            if (mode === 'ai') {
              startBtn.style.display = '';
              startBtn.disabled = false;
            } else {
              startBtn.style.display = 'none';
            }
          }
          // 同步棋种（所有客户端）
          if (s.gameType !== undefined && s.gameType !== gameType) {
            gameType = s.gameType;
            gameGroup.querySelectorAll('.opt-btn').forEach(function (b) {
              b.classList.toggle('active', b.dataset.game === gameType);
            });
          }
          // 同步 AI 难度（所有客户端）
          if (s.aiLevel !== undefined && s.aiLevel !== aiLevel) {
            aiLevel = s.aiLevel;
            aiLevelGroup.querySelectorAll('.opt-btn').forEach(function (b) {
              b.classList.toggle('active', parseInt(b.dataset.level) === aiLevel);
            });
          }
          // AI 模式：worker 端也维护棋盘（用于给观战者同步），客户端用 onState 同步
          // 房主本地已经在 localPlace 推进过棋盘，但仍然以 onState 推回的 board 为准
          // （这样观战者也能看到完整棋盘，且房主和观战者数据一致）
          if (mode === 'ai') {
            if ((s.phase === 'playing' || s.phase === 'end_confirm') && state.phase !== 'playing' && state.phase !== 'end_confirm') {
              state.phase = s.phase;
              state.boardSize = s.boardSize || state.boardSize;
              state.board = (s.board || []).map(function (r) {
                return Array.isArray(r) ? r.slice() : (r && typeof r.length === 'number' ? Array.from(r) : []);
              });
              if (!state.board || !state.board.length) state.board = createBoard(state.boardSize);
              state.turn = s.turn;
              state.moves = s.moves ? s.moves.slice() : [];
              state.lastMove = s.lastMove || null;
              state.capturedB = s.capturedB || 0;
              state.capturedW = s.capturedW || 0;
              state.passes = s.passes || 0;
              state.undoCount = s.undoCount || { black: 2, white: 2 };
              state.confirmDeadBy = s.confirmDeadBy || { black: false, white: false };
              computeLayout();
              modePanel.classList.add('hide');

              // AI 模式下，onState 入局时若该 AI 走且是房主，触发 AI 先手
              // 用 s.hostSide（不依赖本地的 hostSide，避免 hostSideChanged 事件未到时漏判）
              var hs = s.hostSide || hostSide || 'black';
              var aiColorOnEnter = hs === 'black' ? WHITE : BLACK;
              if (isHost && state.turn === aiColorOnEnter && !state.finished) {
                setTimeout(function () {
                  if (state.finished || state.phase !== 'playing') return;
                  var mvE = gameType === 'gomoku'
                    ? aiGomokuMove(state.board, aiColorOnEnter)
                    : aiGoMove(state.board, aiColorOnEnter);
                  if (mvE) localPlace(mvE.r, mvE.c);
                }, 400 + Math.random() * 200);
              }
            } else if (s.phase === 'playing' || s.phase === 'end_confirm') {
              state.phase = s.phase;
              // 严格深拷贝 board（来自 worker）
              state.board = (s.board || []).map(function (r) {
                return Array.isArray(r) ? r.slice() : (r && typeof r.length === 'number' ? Array.from(r) : []);
              });
              state.turn = s.turn;
              state.moves = s.moves ? s.moves.slice() : [];
              state.lastMove = s.lastMove || null;
              state.capturedB = s.capturedB || 0;
              state.capturedW = s.capturedW || 0;
              state.passes = s.passes || 0;
              state.undoCount = s.undoCount || { black: 2, white: 2 };
              state.confirmDeadBy = s.confirmDeadBy || { black: false, white: false };
            } else if (s.phase === 'finished') {
              state.phase = 'finished';
              state.finished = true;
              state.winner = s.winner;
              state.winReason = s.winReason || '';
              state.winLine = s.winLine || null;
              state.board = (s.board || []).map(function (r) {
                return Array.isArray(r) ? r.slice() : (r && typeof r.length === 'number' ? Array.from(r) : []);
              });
            } else if (state.phase === 'playing' || state.phase === 'end_confirm' || state.phase === 'finished') {
              // 退出对局（lobby 等阶段）→ 显示模式选择面板
              state.finished = false;
              state.winner = 0;
              state.moves = [];
              state.lastMove = null;
              state.winLine = null;
              state.winReason = '';
              state.board = createBoard(gameType === 'go' ? SIZE_GO : SIZE_GOMOKU);
              state.boardSize = gameType === 'go' ? SIZE_GO : SIZE_GOMOKU;
              modePanel.classList.remove('hide');
            }
            state.phase = s.phase || state.phase;
          } else if (s.phase === 'playing' || s.phase === 'end_confirm') {
            if (state.phase !== 'playing' && state.phase !== 'end_confirm') {
              state.phase = s.phase;
              state.boardSize = s.boardSize || state.boardSize;
              state.board = createBoard(state.boardSize);
              computeLayout();
              modePanel.classList.add('hide');
            }
            // 严格深拷贝 board，避免行不是数组时直接修改污染服务端状态
            state.board = (s.board || []).map(function (r) {
              return Array.isArray(r) ? r.slice() : (r && typeof r.length === 'number' ? Array.from(r) : []);
            });
            state.turn = s.turn;
            state.finished = !!s.finished;
            state.winner = s.winner;
            state.passes = s.passes || 0;
            state.capturedB = s.capturedB || 0;
            state.capturedW = s.capturedW || 0;
            state.lastMove = s.lastMove || null;
            state.winLine = s.winLine || null;
            state.winReason = s.winReason || '';
            state.moves = s.moves ? s.moves.slice() : [];
            state.undoCount = s.undoCount || { black: 2, white: 2 };
            state.confirmDeadBy = s.confirmDeadBy || { black: false, white: false };
            state.phase = s.phase;
          } else if (s.phase === 'finished') {
            state.phase = 'finished';
            state.finished = true;
            state.winner = s.winner;
            state.winReason = s.winReason || '';
            state.winLine = s.winLine || null;
            state.board = (s.board || []).map(function (r) {
              return Array.isArray(r) ? r.slice() : (r && typeof r.length === 'number' ? Array.from(r) : []);
            });
          } else {
            // 退出对局（lobby 等阶段）→ 显示模式选择面板
            if (state.phase === 'playing' || state.phase === 'end_confirm' || state.phase === 'finished') {
              state.finished = false;
              state.winner = 0;
              state.moves = [];
              state.lastMove = null;
              state.winLine = null;
              state.winReason = '';
              state.board = createBoard(gameType === 'go' ? SIZE_GO : SIZE_GOMOKU);
              state.boardSize = gameType === 'go' ? SIZE_GO : SIZE_GOMOKU;
              // backToMenu 引起的 lobby：房主立即显示 modePanel；玩家延迟 1 秒（让 banner 文案先展示完）
              var isBackToMenuLobby = s.lastRequestResult && s.lastRequestResult.type === 'backToMenu' && s.lastRequestResult.accept;
              var isHostLobby = isBackToMenuLobby && parti && parti.playerId && s.lastRequestResult.from === parti.playerId;
              if (isHostLobby) {
                modePanel.classList.remove('hide');
              } else {
                var delay = isBackToMenuLobby ? 1000 : 0;
                setTimeout(function () { modePanel.classList.remove('hide'); }, delay);
              }
            }
            state.phase = s.phase || 'lobby';
          }
          updateOnlineLobby(s);
          updateSidebarSlots(s);
          // 同步对方请求弹窗
            if (s.pendingRequest) {
              var typeMap2 = { undo: '悔棋', restart: '再来一局', rematch: '重开', resign: '投降', backToMenu: '结束游戏' };
              var reqAckEl = document.querySelector('.req-ack');
              var action = typeMap2[s.pendingRequest.type] || '操作';
              if (s.pendingRequest.noResponse) {
                // 纯通知协议（resign / backToMenu）：
                // - 发起方：弹"已发送【X】请求，等待你确认" + 同意/拒绝按钮 + 倒计时
                // - 对方：弹"对方想要X"，1 秒自动关（无按钮，无倒计时）
                if (s.pendingRequest.from === parti.playerId) {
                  requestText.textContent = '已发送【' + action + '】请求，等待你确认';
                  var reqBtnsNR = document.querySelector('.req-btns');
                  if (reqBtnsNR) reqBtnsNR.style.display = '';
                  if (reqAckEl) reqAckEl.style.display = 'none';
                  requestBanner.classList.add('show');
                  // 启动倒计时（pendingRequest 推送时 createdAt 是新值，避免重复启动）
                  if (s.pendingRequest.createdAt !== countdownKey) {
                    countdownKey = s.pendingRequest.createdAt;
                    startCountdown(REQUEST_TIMEOUT_SEC);
                  }
                } else {
                  // 对方视角：显示等待倒计时（与发起方同步，不自动消失，直到超时或发起方取消）
                  requestText.textContent = '对方想要' + action;
                  var reqBtnsNR2 = document.querySelector('.req-btns');
                  if (reqBtnsNR2) reqBtnsNR2.style.display = 'none';
                  if (reqAckEl) reqAckEl.style.display = 'none';
                  requestBanner.classList.add('show');
                  // 对方也需要看到倒计时（createdAt 与发起方相同，用同一 countdownKey 避免重复启动）
                  if (s.pendingRequest.createdAt !== countdownKey) {
                    countdownKey = s.pendingRequest.createdAt;
                    startCountdown(REQUEST_TIMEOUT_SEC);
                  }
                }
              } else {
                // 请求-回应协议（undo / restart / rematch）
                if (s.pendingRequest.from === parti.playerId) {
                  // 申请方：等待对方确认（隐藏同意/拒绝）+ 倒计时
                  requestText.textContent = '已发送【' + action + '】请求，等待对方确认…';
                  var reqBtns2 = document.querySelector('.req-btns');
                  if (reqBtns2) reqBtns2.style.display = 'none';
                  if (reqAckEl) reqAckEl.style.display = 'none';
                  requestBanner.classList.add('show');
                  if (s.pendingRequest.createdAt !== countdownKey) {
                    countdownKey = s.pendingRequest.createdAt;
                    startCountdown(REQUEST_TIMEOUT_SEC);
                  }
                } else {
                  // 对方：可以同意/拒绝 + 倒计时
                  requestText.textContent = '对方请求【' + action + '】，是否同意？';
                  var reqBtns3 = document.querySelector('.req-btns');
                  if (reqBtns3) reqBtns3.style.display = '';
                  if (reqAckEl) reqAckEl.style.display = 'none';
                  requestBanner.classList.add('show');
                  if (s.pendingRequest.createdAt !== countdownKey) {
                    countdownKey = s.pendingRequest.createdAt;
                    startCountdown(REQUEST_TIMEOUT_SEC);
                  }
                }
              }
            } else if (s.lastRequestResult) {
              // 请求结果弹窗（用 ts 去重）
              stopCountdown();
              if (!shownRequestResults) shownRequestResults = {};
              var rKey = s.lastRequestResult.ts;
              // 注：这里不要 return——下面的状态同步（board / phase）必须走完 render()，否则新对局棋盘无法显示
              shownRequestResults[rKey] = true;

              var resType = s.lastRequestResult.type;
              var isMe = (parti && parti.playerId) ? (s.lastRequestResult.by === parti.playerId) : false;
              var isFromMe = (parti && parti.playerId) ? (s.lastRequestResult.from === parti.playerId) : false;
              var isExpired = !!s.lastRequestResult.expired;
              var acceptText = s.lastRequestResult.accept ? '同意' : '拒绝';
              var bannerText;

              if (isExpired) {
                // 超时场景：双方都看到"超时已自动取消"
                var expText;
                if (resType === 'resign') expText = '投降';
                else if (resType === 'backToMenu') expText = '返回选择';
                else if (resType === 'undo') expText = '悔棋';
                else if (resType === 'restart') expText = '再来一局';
                else if (resType === 'rematch') expText = '重开';
                else expText = '操作';
                bannerText = '【' + expText + '】超时已自动取消';
              } else if (isFromMe) {
                // 发起方视角：看到自己点确认/拒绝的结果
                if (resType === 'resign') {
                  bannerText = s.lastRequestResult.accept ? '你已投降' : '已取消投降';
                } else if (resType === 'backToMenu') {
                  bannerText = s.lastRequestResult.accept ? '你已返回选择' : '已取消返回选择';
                } else {
                  // 正常不应该出现（undo/restart/rematch 对方响应），但兜底
                  bannerText = '你点击了【' + acceptText + '】';
                }
              } else {
                // 对方视角：看到发起方点了什么
                if (resType === 'resign') {
                  bannerText = '对方点击了【' + acceptText + '】（投降）';
                } else if (resType === 'backToMenu') {
                  bannerText = '对方点击了【' + acceptText + '】（返回选择）';
                } else if (isMe) {
                  // undo/restart/rematch 的响应方（自己点过同意/拒绝）：跳过弹窗文案，直接关闭
                  // （之前这里 return，导致 render() 不被调用，新对局棋盘无法同步，bug 已修复）
                  requestBanner.classList.remove('show');
                  stopCountdown();
                  bannerText = ''; // 标记不显示
                } else {
                  bannerText = '对方点击了【' + acceptText + '】';
                }
              }

              if (bannerText) {
                requestText.textContent = bannerText;
                var reqBtnsRes = document.querySelector('.req-btns');
                if (reqBtnsRes) reqBtnsRes.style.display = 'none';
                var reqAckRes = document.querySelector('.req-ack');
                if (reqAckRes) reqAckRes.style.display = 'none';
                requestBanner.classList.add('show');
                setTimeout(function () {
                  requestBanner.classList.remove('show');
                }, 1000);
              } else {
                stopCountdown();
              }
            } else {
              // pendingRequest 已清且无结果：若弹窗仍在显示，1 秒后再关
              stopCountdown();
              if (requestBanner.classList.contains('show')) {
                setTimeout(function () {
                  requestBanner.classList.remove('show');
                }, 1000);
              }
            }
          render();
        });
        if (parti.onMessage) {
          parti.onMessage(function (msg) {
            if (!msg) return;
            if (msg.type === 'requestPending') {
              // requestPending 事件兜底：对方在 onState 之前先看到弹窗（避免对局中弹窗被后续 state 推回覆盖）
              if (msg.noResponse && msg.from !== parti.playerId) {
                var typeMap3 = { undo: '悔棋', restart: '再来一局', rematch: '重开', resign: '投降', backToMenu: '结束游戏' };
                var act3 = typeMap3[msg.type] || '操作';
                requestText.textContent = '对方想要' + act3;
                var reqBtnsIM = document.querySelector('.req-btns');
                if (reqBtnsIM) reqBtnsIM.style.display = 'none';
                var reqAckIM = document.querySelector('.req-ack');
                if (reqAckIM) reqAckIM.style.display = 'none';
                requestBanner.classList.add('show');
                // 不在这里启动倒计时：onState 推回时由 pendingRequest.createdAt 统一驱动，避免本地时间与 worker 端 createdAt 错位
              }
            } else if (msg.type === 'requestCleared' || msg.type === 'requestRejected') {
              // 文字切换已由 onState 的 lastRequestResult 处理
            } else if (msg.type === 'peerExited') {
              // 对方离开（主动退出或掉线均触发），提示由 onState 的 finished 状态驱动
              // 这里只给一个轻提示，不干扰主流程
            } else if (msg.type === 'hostSideChanged') {
              // 房主切换了执子方，观战者跟随更新
              myAiSide = msg.hostSide;
              hostSide = msg.hostSide;
              updateSideActive();
              // 侧边栏的 AI/房主分配由 updateSidebarSlots 在 onState 时更新，无需额外操作
            } else if (msg.type === 'gameStarted') {
              // 游戏开始/重开（来自 worker 的 restart/rematch/startAI）
              // 重置本地状态，与 worker 保持同步
              state.phase = 'playing';
              state.boardSize = msg.boardSize || state.boardSize;
              state.board = createBoard(state.boardSize);
              // 五子棋/围棋固定黑先白后（与 hostSide 无关）
              state.turn = 1 /*BLACK*/;
              state.finished = false;
              state.winner = 0;
              state.moves = [];
              state.undoCount = { black: 2, white: 2 };
              state.capturedB = 0;
              state.capturedW = 0;
              state.passes = 0;
              state.lastMove = null;
              state.winLine = null;
              state.winReason = '';
              state.confirmDeadBy = { black: false, white: false };
              // 若广播中带了 hostSide，观战者同步执子方
              if (msg.hostSide) {
                myAiSide = msg.hostSide;
                hostSide = msg.hostSide;
              }
              if (winBanner) winBanner.classList.remove('show');
              modePanel.classList.add('hide');
              computeLayout();
              render();

              // 房主执白时，AI(黑) 需要先手
              // 注意：AI 模式下仅有房主会真正推进棋盘（观战者由后续 onState 同步）
              if (mode === 'ai' && isHost) {
                var aiColor3 = myAiSide === 'black' ? WHITE : BLACK;
                if (state.turn === aiColor3 && !state.finished) {
                  setTimeout(function () {
                    if (state.finished || state.phase !== 'playing') return;
                    var mv3 = gameType === 'gomoku'
                      ? aiGomokuMove(state.board, aiColor3)
                      : aiGoMove(state.board, aiColor3);
                    if (mv3) localPlace(mv3.r, mv3.c);
                  }, 400 + Math.random() * 200);
                }
              }
            } else if (msg.type === 'game:over') {
              // 游戏结束（来自 worker 的 finishGame）
              if (!state.finished) {
                state.finished = true;
                state.winner = msg.winner;
                state.winReason = msg.reason || '';
                state.phase = 'finished';
                winText.textContent = msg.winner === 1 ? '黑方胜' : msg.winner === 2 ? '白方胜' : '平局';
                winSub.textContent = msg.reason || '';
                winBanner.classList.add('show');
                render();
              }
            } else if (msg.type === 'deadNegotiation') {
              showToast('双方连续 Pass，进入死活协商阶段');
            } else if (msg.type === 'deadConfirmProgress') {
              if (msg.black && msg.white) showToast('双方已确认，开始结算…');
            } else if (msg.type === 'gameResumed') {
              showToast('已回到对局中');
            } else if (msg.type === 'requestExpired') {
              // 文字切换已由 onState 的 lastRequestResult 处理（"X 超时已自动取消"）
            }
          });
        }
        partiAction('joinOnline', {});
      }

      /* ==================================================================
         本地落子（AI/单人）
      ================================================================== */
      function localPlace(r, c) {
        if (state.finished || state.phase !== 'playing') return;
        if (r < 0 || r >= state.boardSize || c < 0 || c >= state.boardSize) return;
        if (state.board[r][c] !== EMPTY) return;

        if (gameType === 'gomoku') {
          state.board[r][c] = state.turn;
          state.moves.push({ r: r, c: c, color: state.turn });
          state.lastMove = { r: r, c: c };

          var winLine = checkGomokuWin(state.board, r, c, state.turn);
          if (winLine) {
            state.winLine = winLine;
            render(); playClick();
            finishGame(state.turn, '五子连珠');
            return;
          }
          var full = true;
          for (var rr = 0; rr < state.boardSize; rr++) for (var cc = 0; cc < state.boardSize; cc++) if (state.board[rr][cc] === EMPTY) { full = false; break; }
          if (full) { render(); finishGame(0, '棋盘已满'); return; }

          state.turn = state.turn === BLACK ? WHITE : BLACK;
          playClick(); render();
          // 同步落子给非房主（在线 AI 模式观战）
          // 把刚落子的颜色（上一轮）传过去，因为 worker 端 st.turn 此时已切换
          if (hasParti() && mode === 'ai') {
            partiAction('place', { r: r, c: c, color: state.turn === BLACK ? WHITE : BLACK });
          }

          // AI 回合：执白时轮到 AI 下；执黑时轮到 AI 下
          if (mode === 'ai' && !state.finished) {
            var aiColor = myAiSide === 'black' ? WHITE : BLACK;
            if (state.turn === aiColor) {
              setTimeout(function () {
                var mv = gameType === 'gomoku'
                  ? aiGomokuMove(state.board, aiColor)
                  : aiGoMove(state.board, aiColor);
                if (mv && !state.finished) localPlace(mv.r, mv.c);
              }, 200 + Math.random() * 200);
            }
          }
        } else {
          var testBoard = cloneBoard(state.board);
          var res = goPlaceStone(testBoard, r, c, state.turn);
          if (!res) return;
          state.board = testBoard;
          state.moves.push({ r: r, c: c, color: state.turn, captured: res.captured });
          state.lastMove = { r: r, c: c };
          if (state.turn === BLACK) state.capturedB += res.captured.length;
          else state.capturedW += res.captured.length;
          state.passes = 0;
          state.turn = state.turn === BLACK ? WHITE : BLACK;
          playClick(); render();
          if (hasParti() && mode === 'ai') {
            partiAction('place', { r: r, c: c, color: state.turn === BLACK ? WHITE : BLACK, captured: res.captured });
          }

          // AI 回合：执白时轮到 AI 下；执黑时轮到 AI 下
          if (mode === 'ai' && !state.finished) {
            var aiColor = myAiSide === 'black' ? WHITE : BLACK;
            if (state.turn === aiColor) {
              setTimeout(function () {
                var mv = gameType === 'gomoku'
                  ? aiGomokuMove(state.board, aiColor)
                  : aiGoMove(state.board, aiColor);
                if (mv && !state.finished) localPlace(mv.r, mv.c);
              }, 200 + Math.random() * 200);
            }
          }
        }
      }

      function finishGame(winner, reason) {
        if (state.finished) return;
        state.finished = true;
        state.winner = winner;
        state.winReason = reason;
        state.phase = 'finished';

        var s = state.stats;
        if (winner === BLACK) { s.blackWins++; s.whiteLosses++; }
        else if (winner === WHITE) { s.whiteWins++; s.blackLosses++; }
        else { s.blackDraws++; s.whiteDraws++; }

        winText.textContent = winner === BLACK ? '黑方胜' : winner === WHITE ? '白方胜' : '平局';
        winSub.textContent = reason || '';
        winBanner.classList.add('show');
        playWin();
        render();

        // AI 模式下通知 Worker 更新状态（避免状态不同步导致鬼畜/重开失效）
        if (hasParti() && mode === 'ai') {
          partiAction('aiGameOver', { winner: winner, reason: reason });
        }
      }

      function localUndo() {
        if (state.finished || state.moves.length === 0) return;
        // AI 模式：房主执方悔棋计数；在线模式：本方计数
        var color = mode === 'ai' ? myAiSide : (myRole === BLACK ? 'black' : 'white');
        if ((state.undoCount[color] || 0) <= 0) return;
        var steps = mode === 'ai' ? 2 : 1;
        for (var i = 0; i < steps && state.moves.length > 0; i++) {
          var last = state.moves.pop();
          state.board[last.r][last.c] = EMPTY;
          if (last.captured && last.captured.length) {
            last.captured.forEach(function (s) { state.board[s.r][s.c] = last.color === BLACK ? WHITE : BLACK; });
            if (last.color === BLACK) state.capturedB -= last.captured.length;
            else state.capturedW -= last.captured.length;
          }
        }
        state.undoCount[color] = Math.max(0, (state.undoCount[color] || 0) - 1);
        state.turn = BLACK;
        state.finished = false;
        state.winner = 0;
        state.winLine = null;
        state.passes = 0;
        state.lastMove = state.moves.length ? state.moves[state.moves.length - 1] : null;
        winBanner.classList.remove('show');
        render();
      }

      /* ==================================================================
         事件绑定
      ================================================================== */
      // 棋种切换：人机模式下进入对局后锁定，在线模式仅房主可切并同步
      gameGroup.addEventListener('click', function (e) {
        var btn = e.target.closest('.opt-btn'); if (!btn) return;
        // 人机模式：进入对局后禁止切换
        if (mode === 'ai' && (state.phase === 'playing' || state.phase === 'end_confirm')) return;
        // 在线模式：仅房主能切换
        if (mode === 'online' && !isHost) return;
        gameGroup.querySelectorAll('.opt-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        gameType = btn.dataset.game;
        if (mode === 'online' && hasParti) {
          partiAction('setGameType', { gameType: gameType });
        }
      });

      modeGroup.addEventListener('click', function (e) {
        var btn = e.target.closest('.opt-btn'); if (!btn) return;
        // 在线模式：仅房主能切换
        if (mode === 'online' && hasParti() && !isHost) return;
        modeGroup.querySelectorAll('.opt-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        mode = btn.dataset.mode;
        aiLevelGroup.classList.toggle('show', mode === 'ai');
        onlineLobby.classList.toggle('hide', mode === 'ai');
        // 执子方选择：仅 AI 模式显示（在线模式由双方分别点选加入）
        sideGroup.classList.toggle('show', mode === 'ai');
        updateSideActive();
        // 切换模式时更新开始按钮状态
        if (mode === 'ai') {
          startBtn.classList.remove('green');
          startBtn.style.display = '';
          startBtn.disabled = false;
          // 清空侧边栏在线槽
          playerBlackEl.innerHTML = '● 黑方 <span class="name-text">等待加入…</span>';
          playerBlackEl.className = 'slot-name empty';
          slotBlack.classList.add('empty');
          slotBlack.classList.remove('me', 'ready');
          statusBlackEl.textContent = '';
          statusBlackEl.className = 'slot-status waiting';
          playerWhiteEl.innerHTML = '○ 白方 <span class="name-text">等待加入…</span>';
          playerWhiteEl.className = 'slot-name empty';
          slotWhite.classList.add('empty');
          slotWhite.classList.remove('me', 'ready');
          statusWhiteEl.textContent = '';
          statusWhiteEl.className = 'slot-status waiting';
        } else {
          startBtn.style.display = 'none';
          // 在线模式：自动加入房间（让 initOnlineSession 启动）
          if (!onlineJoined && hasParti) {
            joinOnline();
          }
        }
        // 在线模式下同步模式给其他玩家
        if (hasParti() && isHost) {
          partiAction('setMode', { mode: mode, gameType: gameType, aiLevel: aiLevel });
        }
      });

      // 棋种切换（仅在线模式的房主有效，同步给其他玩家）— 已合并到上面单一 handler

      aiLevelGroup.addEventListener('click', function (e) {
        var btn = e.target.closest('.opt-btn'); if (!btn) return;
        // 仅房主能切换难度
        if (!isHost) return;
        aiLevelGroup.querySelectorAll('.opt-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        aiLevel = parseInt(btn.dataset.level);
        if (hasParti) {
          partiAction('setAiLevel', { level: aiLevel });
        }
      });

      // 执子方选择：
      //   AI 模式：仅房主可改；影响 startAI 时的先手方与本方执子
      //   在线模式：本人可点；选择后通过 chooseSide 协议上送 worker
      sideGroup.addEventListener('click', function (e) {
        var btn = e.target.closest('.opt-btn'); if (!btn) return;
        var side = btn.dataset.side;
        if (mode === 'ai') {
          if (!isHost) return;
          hostSide = side;
          myAiSide = side;
          updateSideActive();
          // 同步给所有观战者
          if (hasParti) {
            partiAction('setHostSide', { side: side });
          }
        } else if (mode === 'online') {
          if (hasParti) {
            // 若点击的是已选的自己所在方，做"换边"：先 leaveSide 再 chooseSide
            var myCurrentSide = (parti.playerId === state.blackPlayer) ? 'black' :
              (parti.playerId === state.whitePlayer) ? 'white' : null;
            if (myCurrentSide === side) {
              // 同一边：切换为"离开"（无操作，纯视觉提示即可，不发协议）
              showToast('已是当前执子方');
              return;
            }
            // 换边：先 leaveSide 再 chooseSide
            if (myCurrentSide) {
              partiAction('leaveSide', {});
            }
            partiAction('chooseSide', { side: side });
          }
        }
      });

      // 同步执子方高亮
      // - AI 模式：高亮当前房主所选执子方（房主选择/观战者跟随）
      // - 在线模式：高亮本人所选执子方
      function updateSideActive() {
        var activeSide = null;
        if (mode === 'ai') {
          activeSide = hostSide; // 房主和观战者都跟随房主选择
        } else if (mode === 'online') {
          if (parti.playerId === state.blackPlayer) activeSide = 'black';
          else if (parti.playerId === state.whitePlayer) activeSide = 'white';
        }
        sideGroup.querySelectorAll('.opt-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.side === activeSide);
        });
      }

      // 在线模式：点击 lobby 里的空位 = 选择执子方；点击自己已占的位 = 退出执子方
      onlineSlotBlack.addEventListener('click', function () {
        if (mode !== 'online' || !hasParti) return;
        var meBlack = parti.playerId && parti.playerId === state.blackPlayer;
        // 自己已选黑：未准备时再点一下退出执子方；已准备时只提示
        if (meBlack) {
          if (state.blackReady) {
            showToast('已是当前执子方');
          } else {
            partiAction('leaveSide', {});
          }
          return;
        }
        if (state.blackPlayer && !meBlack) {
          showToast('黑方已被对方选择');
          return;
        }
        // 自己当前是白方（换边）：先 leaveSide
        var meWhite = parti.playerId && parti.playerId === state.whitePlayer;
        if (meWhite) partiAction('leaveSide', {});
        partiAction('chooseSide', { side: 'black' });
      });
      onlineSlotWhite.addEventListener('click', function () {
        if (mode !== 'online' || !hasParti) return;
        var meWhite = parti.playerId && parti.playerId === state.whitePlayer;
        if (meWhite) {
          if (state.whiteReady) {
            showToast('已是当前执子方');
          } else {
            partiAction('leaveSide', {});
          }
          return;
        }
        if (state.whitePlayer && !meWhite) {
          showToast('白方已被对方选择');
          return;
        }
        var meBlack = parti.playerId && parti.playerId === state.blackPlayer;
        if (meBlack) partiAction('leaveSide', {});
        partiAction('chooseSide', { side: 'white' });
      });

      onlineReadyBtn.addEventListener('click', function () {
        if (!hasParti) return;
        myReady = !myReady;
        partiAction('toggleReady', {});
      });

      startBtn.addEventListener('click', function () {
        if (!hasParti) return;
        if (mode === 'online') {
          // 仅房主可点开始
          if (!isHost) return;
          // 必须双方都已选执子方且双方都已准备
          if (!state.blackPlayer || !state.whitePlayer) {
            showToast('等待对方加入…');
            return;
          }
          if (!state.blackReady || !state.whiteReady) {
            showToast('等待所有玩家准备就绪…');
            return;
          }
          partiAction('startGameOnline', {});
        } else if (mode === 'ai') {
          if (isHost) {
            // 房主开始AI对局：广播给所有玩家进入观战
            // 先手固定黑先，hostSide 仅影响房主与 AI 的执子分配
            partiAction('startAI', { gameType: gameType, hostSide: hostSide });
          }
        }
      });

      reqAcceptBtn.addEventListener('click', function () {
        requestBanner.classList.remove('show');
        stopCountdown();
        partiAction('respondRequest', { accept: true });
      });
      reqRejectBtn.addEventListener('click', function () {
        requestBanner.classList.remove('show');
        stopCountdown();
        partiAction('respondRequest', { accept: false });
      });

      btnUndo.addEventListener('click', function () {
        // AI 模式：本地撤销（撤销 AI + 玩家两步），不走 worker（worker 端 AI 模式不维护棋盘）
        // 同时通知 worker 同步撤销观战者那边的状态
        // 在线模式：走请求流程，等对方同意
        if (mode === 'ai') {
          if (!isHost) return;
          localUndo();
          if (hasParti) {
            partiAction('undo', {});
          }
          return;
        }
        if (hasParti) {
          partiAction('undo', {});
        } else {
          localUndo();
        }
      });

      btnRematch.addEventListener('click', function () {
        // 重开：统一"重开"按钮
        // - AI 模式：任何阶段都可点（房主），worker 直接重置（不需要对方确认）
        // - 在线模式：仅对局进行中可见，点了走请求流程，等对方同意
        if (mode === 'ai') {
          if (!isHost) return;
          if (hasParti()) {
            partiAction('restart', {});
          } else {
            winBanner.classList.remove('show');
            startAI();
          }
          return;
        }
        // 在线模式
        if (state.phase !== 'playing' || state.finished) return;
        if (hasParti()) {
          partiAction('rematch', {});
        } else {
          // 本地预览（无 parti）：直接本地重置
          localRematch();
        }
      });

      btnResign.addEventListener('click', function () {
        if (state.finished) return;
        if (state.phase !== 'playing' && state.phase !== 'end_confirm') return;
        // 直接发请求；弹窗从 pendingRequest 渲染（对方看到"对方想要投降"无按钮 1秒）
        if (hasParti) {
          partiAction('resign', {});
        } else {
          // 本地预览（无 parti）：直接走 finishGame
          var loser = state.turn;
          var winner = loser === BLACK ? WHITE : BLACK;
          finishGame(winner, '投降');
        }
      });

      btnContinue.addEventListener('click', function () {
        if (!hasParti) return;
        if (state.phase !== 'end_confirm') return;
        partiAction('continueGame', {});
      });

      btnConfirmDead.addEventListener('click', function () {
        if (!hasParti) return;
        if (state.phase !== 'end_confirm') return;
        partiAction('confirmDead', {});
      });

      btnBack.addEventListener('click', function () {
        if (hasParti()) {
          // AI/在线模式统一走 noResponse 协议：弹窗显示「已发送【结束游戏】请求，等待你确认」
          // 房主点同意/拒绝确认；超时自动取消
          partiAction('backToMenu', {});
        } else {
          // 本地预览：直接重置回面板
          winBanner.classList.remove('show');
          state.phase = 'idle';
          state.finished = false;
          state.winner = 0;
          state.moves = [];
          state.lastMove = null;
          state.winLine = null;
          state.winReason = '';
          state.board = createBoard(gameType === 'go' ? SIZE_GO : SIZE_GOMOKU);
          state.boardSize = gameType === 'go' ? SIZE_GO : SIZE_GOMOKU;
          modePanel.classList.remove('hide');
          render();
        }
      });

      /* ==================================================================
         棋盘点击
         ================================================================== */
      canvas = document.getElementById('board');
      ctx = canvas.getContext('2d');

      function getBoardPos(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var x = clientX - rect.left, y = clientY - rect.top;
        var c = Math.round((x - padding) / cellSize);
        var r = Math.round((y - padding) / cellSize);
        if (r < 0 || r >= state.boardSize || c < 0 || c >= state.boardSize) return null;
        return { r: r, c: c };
      }

      canvas.addEventListener('click', function (e) {
        if (state.finished || state.phase !== 'playing') return;
        ensureAudio();
        var pos = getBoardPos(e.clientX, e.clientY);
        if (!pos) return;
        if (mode === 'online') {
          if (hasParti() && state.turn === myRole) partiAction('place', { r: pos.r, c: pos.c });
        } else if (mode === 'ai') {
          // AI 模式：房主根据执子方判断轮到谁
          // 执黑：轮到 BLACK 时房主下；执白：轮到 WHITE 时房主下
          var myColor = myAiSide === 'black' ? 1 : 2;
          if (isHost && state.turn === myColor) localPlace(pos.r, pos.c);
        }
      });

      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        var t = e.touches[0];
        var pos = getBoardPos(t.clientX, t.clientY);
        if (!pos) return;
        ensureAudio();
        if (state.phase !== 'playing' || state.finished) return;
        if (mode === 'online') {
          if (hasParti() && state.turn === myRole) partiAction('place', { r: pos.r, c: pos.c });
        } else if (mode === 'ai') {
          var myColor = myAiSide === 'black' ? 1 : 2;
          if (isHost && state.turn === myColor) localPlace(pos.r, pos.c);
        }
      }, { passive: false });

      window.addEventListener('resize', function () {
        clearTimeout(window._resizeTimer);
        window._resizeTimer = setTimeout(function () {
          if (state.boardSize) { computeLayout(); render(); }
        }, 200);
      });

      /* ==================================================================
         初始化
      ================================================================== */
      state.board = createBoard(SIZE_GOMOKU);
      state.boardSize = SIZE_GOMOKU;
      computeLayout();
      render();

      var tips = {
        gomoku: '五子棋：黑先白后，横竖斜连成 5 子即胜（无禁手）。',
        go: '围棋：黑先白后，无气棋子自动提走，禁止自杀。双方连续 Pass 后数目。'
      };
      ruleTip.textContent = tips[gameType];

      // 在线模式默认进入
      if (mode === 'online') {
        joinOnline();
      }

      partiLog('弈合 ready');
    })();
  </script>
</body>

</html>
