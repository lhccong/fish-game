<div class="stage">
  <main class="board">
    <canvas id="canvas" width="480" height="480"></canvas>
  </main>

  <aside class="side">
    <h2>排行榜</h2>
    <ol id="rank"></ol>
    <p class="hint">方向键 / WASD · 撞墙重生</p>
    <div class="pad">
      <button data-dir="up" class="key">▲</button>
      <div class="pad-row">
        <button data-dir="left" class="key">◀</button>
        <button data-dir="down" class="key">▼</button>
        <button data-dir="right" class="key">▶</button>
      </div>
    </div>
  </aside>
</div>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
    background: radial-gradient(1200px 600px at 20% 0%, #1e293b 0%, #0b1220 60%, #06080f 100%);
    min-height: 100%;
  }

  /* 棋盘 + 侧栏作为一个整体在视口里水平+垂直居中，永远只占两列 */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    min-height: 100vh;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }

  .board {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-width: 0;
    flex: 1;
  }

  canvas {
    background: #0b1220;
    border-radius: 16px;
    display: block;
    /* 宽屏：高度上限 72vh 与 520px 之间取较小者；侧栏 240+gap 24+padding 共 ~300 留给视口 */
    width: min(72vh, 520px, calc(100vw - 320px));
    max-width: 520px;
    aspect-ratio: 1;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(148, 163, 184, 0.18),
      inset 0 0 0 1px rgba(148, 163, 184, 0.08);
    touch-action: none;
  }

  .pad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .pad-row { display: flex; gap: 6px; }
  .key {
    width: 56px; height: 44px;
    font-size: 18px;
    cursor: pointer;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 10px;
    background: rgba(30, 41, 59, 0.7);
    color: #e5e7eb;
    transition: background 80ms ease, transform 80ms ease;
  }
  .key:hover  { background: rgba(51, 65, 85, 0.9); }
  .key:active { background: #475569; transform: translateY(1px); }

  /* 排行榜：固定宽，垂直居中，玻璃质感 */
  .side {
    width: 240px;
    flex-shrink: 0;
    align-self: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    overflow: hidden; /* 防止任何内部内容把侧栏撑出去 */
  }
  .side h2 {
    margin: 0 0 12px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }
  #rank {
    margin: 0;
    padding-left: 22px;       /* 保留 ol 编号位置 */
    font-size: 14px;
    line-height: 1.4;
    min-width: 0;             /* 关键：让 ol 可以被 flex 父容器约束 */
  }
  #rank li {
    margin-bottom: 6px;
    padding: 2px 0;
  }
  #rank li.me { font-weight: 700; color: #f8fafc; }

  /* 主行：dot + 名字 + 分数，永远单行；超长名字省略号 */
  #rank li .row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  #rank li .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #rank li .score {
    flex-shrink: 0;
    color: #cbd5e1;
    font-variant-numeric: tabular-nums;
  }
  /* 副行：重生倒计时独占一行，不影响主行宽度 */
  #rank li .dead {
    display: block;
    font-size: 11px;
    color: #64748b;
    margin-top: 1px;
    padding-left: 16px;       /* 跟 dot 之后的文字对齐 */
  }

  .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 6px currentColor;
    flex-shrink: 0;
  }
  .hint {
    color: #64748b;
    font-size: 12px;
    margin: 16px 0 0;
    text-align: center;
    line-height: 1.6;
  }

  /* 窄屏：竖排，排行榜在棋盘下方；棋盘占满视口宽度（只受高度约束） */
  @media (max-width: 820px) {
    html, body { height: auto; }
    .stage { flex-direction: column; padding: 12px; gap: 12px; min-height: 100vh; }
    .board { gap: 12px; flex: 0 0 auto; }
    /* 关键：手机上去掉 100vw-320px 的减法，棋盘 = 视口宽 - 内边距，撑满 */
    canvas {
      width: min(calc(100vw - 24px), 60vh, 520px);
      max-width: none;
    }
    .side  { width: 100%; max-width: 480px; align-self: auto; }
    .pad   { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .pad-row { flex-direction: row; }
    .key   { width: 52px; height: 44px; font-size: 20px; }
  }

  /* 进一步缩窄（典型手机竖屏） */
  @media (max-width: 480px) {
    .stage { padding: 8px; gap: 10px; }
    canvas { width: min(calc(100vw - 16px), 60vh); }
    .key   { width: 56px; height: 48px; font-size: 22px; }
  }
</style>

<script>
  const canvas = document.getElementById('canvas');
  const g = canvas.getContext('2d');
  const rankEl = document.getElementById('rank');

  // 让画布的逻辑分辨率跟 CSS 视觉尺寸对齐（保持正方形 1:1）
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const side = Math.max(320, Math.floor(Math.min(rect.width, rect.height)));
    if (canvas.width !== side || canvas.height !== side) {
      canvas.width = side;
      canvas.height = side;
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // ── 输入 ──────────────────────────────────────────────────────
  function send(dir) { parti.action('turn', { dir }); }
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', (e) => {
    const dir = KEYS[e.key];
    if (dir) { e.preventDefault(); send(dir); }
  });
  document.querySelectorAll('.key').forEach((b) => {
    b.onclick = () => send(b.dataset.dir);
  });

  // ── 渲染（24×24 整屏可见）────────────────────────────────────
  function render(state) {
    try {
      const cols = state.cols, rows = state.rows;
      resizeCanvas();
      const cw = canvas.width / cols, ch = canvas.height / rows;

      // 背景
      g.fillStyle = '#0b1220';
      g.fillRect(0, 0, canvas.width, canvas.height);

      // 网格线（淡淡的）
      g.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      g.lineWidth = 1;
      for (let i = 1; i < cols; i++) {
        g.beginPath();
        g.moveTo(i * cw, 0); g.lineTo(i * cw, canvas.height);
        g.stroke();
      }
      for (let j = 1; j < rows; j++) {
        g.beginPath();
        g.moveTo(0, j * ch); g.lineTo(canvas.width, j * ch);
        g.stroke();
      }

      // 食物
      for (const f of state.food) {
        const cx = (f.x + 0.5) * cw, cy = (f.y + 0.5) * ch;
        const r = Math.min(cw, ch) * 0.36;
        // 光晕
        const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
        grad.addColorStop(0, 'rgba(244, 63, 94, 0.9)');
        grad.addColorStop(1, 'rgba(244, 63, 94, 0)');
        g.fillStyle = grad;
        g.beginPath();
        g.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f43f5e';
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
      }

      // 蛇
      for (const id in state.snakes) {
        const s = state.snakes[id];
        if (!s.alive) continue;
        for (let i = 0; i < s.body.length; i++) {
          const seg = s.body[i];
          const pad = i === 0 ? 0.5 : 1;
          g.fillStyle = s.color;
          g.globalAlpha = i === 0 ? 1 : 0.92;
          g.fillRect(seg.x * cw + pad, seg.y * ch + pad, cw - pad * 2, ch - pad * 2);
        }
        g.globalAlpha = 1;
        // 头部白边
        const h = s.body[0];
        g.strokeStyle = 'rgba(248, 250, 252, 0.9)';
        g.lineWidth = 1.5;
        g.strokeRect(h.x * cw + 1, h.y * ch + 1, cw - 2, ch - 2);
      }

      // 排行榜（含重生读秒）
      const now = Date.now();
      const entries = Object.entries(state.snakes)
        .sort((a, b) => b[1].score - a[1].score);
      rankEl.innerHTML = '';
      for (const [id, s] of entries) {
        const li = document.createElement('li');
        if (id === parti.playerId) li.className = 'me';
        const dot = '<span class="dot" style="background:' + s.color + ';color:' + s.color + '"></span>';
        const name = (s.name || '玩家') + (id === parti.playerId ? '（你）' : '');

        // 主行：点 + 名字（可省略号） + 分数，固定单行结构
        let html = '<span class="row">' +
                     dot +
                     '<span class="name">' + name + '</span>' +
                     '<span class="score">' + s.score + '</span>' +
                   '</span>';

        // 副行：重生倒计时独占一行，不会影响主行宽度
        if (!s.alive && s.respawnAt) {
          const left = Math.max(0, Math.ceil((s.respawnAt - now) / 1000));
          html += '<span class="dead">重生中 ' + left + 's</span>';
        }
        li.innerHTML = html;
        rankEl.appendChild(li);
      }
    } catch (err) {
      try { console.error('snake render error', err); } catch (_) {}
    }
  }

  parti.onState(render);
  parti.ready();
</script>
